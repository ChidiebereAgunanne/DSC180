<script type="text/javascript">
	function getParameterByName(name, url) {
		var url = window.location.href;
		var name = name.replace(/[\[\]]/g, '\\$&');
		var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
			results = regex.exec(url);
		if (!results) return null;
		if (!results[2]) return '';
		return decodeURIComponent(results[2].replace(/\+/g, ' '));
	}
	function updateUrlParameter(uri, key, value) {
	    var i = uri.indexOf('#');
	    var hash = i === -1 ? ''  : uri.substr(i);
	         uri = i === -1 ? uri : uri.substr(0, i);
	
	    var re = new RegExp("([?&])" + key + "=.*?(&|$)", "i");
	    var separator = uri.indexOf('?') !== -1 ? "&" : "?";
	    if (uri.match(re)) {
	        uri = uri.replace(re, '$1' + key + "=" + value + '$2');
	    } else {
	        uri = uri + separator + key + "=" + value;
	    }
	    return uri + hash;
	}

	var TCF_API_VERSION = 2;
	var US_PRIVACY_API_VERSION = 1;

	// Consent normally arrives as query parameters, but a caller may leave a macro unreplaced
	// ({GDPR_CONSENT}, $US_PRIVACY, [GPP_STRING], %%CONSENT%% ...). Instead of guessing which macro
	// syntax to reject, every value is accepted only when it matches the shape its own spec defines,
	// so placeholders we have never seen are rejected as well.
	var GDPR_FORMAT = /^[01]$/;                       // TCF gdprApplies as sent on the wire
	var TC_STRING_FORMAT = /^[A-Za-z0-9\-_.]+$/;      // base64url, dot-separated segments
	var US_PRIVACY_FORMAT = /^[0-9][yYnN-]{3}$/;      // version digit + 3 flags, e.g. 1YNN
	var GPP_STRING_FORMAT = /^[A-Za-z0-9\-_.~]+$/;    // base64url sections joined by ~
	var GPP_SIDS_FORMAT = /^[0-9]+(,[0-9]+)*$/;       // applicable section ids, e.g. 7,8

	// null is checked explicitly: a regex would coerce it to the string "null", which some of the
	// formats above would happily accept.
	function isMissingConsent(value, validFormat) {
		return value === null || !validFormat.test(value);
	}

	// Asks the page's IAB TCF v2 CMP for GDPR applicability and the TC string.
	// The CMP belongs to the hosting page, so it may be absent or throw; either way we keep the
	// query-string values and let the sync continue.
	function fillMissingGdprConsentFromBrowser() {
		if (typeof window.__tcfapi !== "function") {
			return;
		}
		try {
			window.__tcfapi("getTCData", TCF_API_VERSION, function (tcData, wasSuccessful) {
				if (!wasSuccessful || !tcData) {
					return;
				}
				if (isMissingConsent(gdpr, GDPR_FORMAT) && typeof tcData.gdprApplies === "boolean") {
					gdpr = tcData.gdprApplies ? "1" : "0";
				}
				if (isMissingConsent(gdprStr, TC_STRING_FORMAT) && tcData.tcString) {
					gdprStr = tcData.tcString;
				}
			});
		} catch (cmpError) {
			// A broken CMP must not stop the sync.
		}
	}

	// Asks the page's US Privacy (CCPA) CMP for the us_privacy string.
	function fillMissingUsPrivacyFromBrowser() {
		if (typeof window.__uspapi !== "function") {
			return;
		}
		try {
			window.__uspapi("getUSPData", US_PRIVACY_API_VERSION, function (uspData, wasSuccessful) {
				if (wasSuccessful && uspData && uspData.uspString) {
					usPrivacy = uspData.uspString;
				}
			});
		} catch (cmpError) {
			// A broken CMP must not stop the sync.
		}
	}

	// Asks the page's GPP CMP for the GPP string and the section ids it covers. "ping" returns both
	// and is answered even while the CMP is still loading, which getGPPData is not.
	function fillMissingGppConsentFromBrowser() {
		if (typeof window.__gpp !== "function") {
			return;
		}
		try {
			window.__gpp("ping", function (gppData) {
				if (!gppData) {
					return;
				}
				if (isMissingConsent(gppStr, GPP_STRING_FORMAT) && gppData.gppString) {
					gppStr = gppData.gppString;
				}
				// Older CMPs expose sectionList instead of applicableSections.
				var gppSections = gppData.applicableSections || gppData.sectionList;
				if (isMissingConsent(gppSids, GPP_SIDS_FORMAT) && gppSections && gppSections.length) {
					gppSids = gppSections.join(",");
				}
			});
		} catch (cmpError) {
			// A broken CMP must not stop the sync.
		}

    if (isMissingConsent(gdpr, GDPR_FORMAT) || isMissingConsent(gdprStr, TC_STRING_FORMAT)) {

    var trackingConsentSuffix = "%26gdpr%3D" + encodeURIComponent(gdpr || "")
        + "%26gdprstr%3D" + encodeURIComponent(gdprStr)

    var ut_dps=[];
    function initUtdps() {
        for(var i=0,ck=document.cookie.split(';');i<ck.length;i++) {
            try {

                if(c[0].replace(/^\s+|\s+$/g,'')=='UTDP') {

    function getCookie(name) {

        var value = re.exec(document.cookie);
        return (value != null) ? unescape(value[1]) : "";
    }
    function plantPixels() {

    function getAllImgs() {
